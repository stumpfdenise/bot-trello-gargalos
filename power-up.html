<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowGuard Power-Up</title>
</head>
<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script>
    window.TrelloPowerUp.initialize({
      "board-buttons": function (t, opts) {
        return [
          {
            text: "FlowGuard",
            condition: "always",
            callback: function (t) {
              return t.popup({
                title: "FlowGuard",
                url: "power-up-summary.html",
              });
            },
          },
        ];
      },
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowGuard Power-Up</title>
</head>
<body>
  <script src="https://p.trello.com/power-ups.js"></script>
  <script>
    window.TrelloPowerUp.initialize({
      "board-buttons": function (t, opts) {
        return [
          {
            text: "FlowGuard",
            condition: "always",
            url: "https://bot-trello-gargalos.onrender.com/dashboard.html",
            target: "_blank",
          },
        ];
      },
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowGuard Power-Up</title>
</head>
<body>
  <script src="https://p.trello.com/power-ups.js"></script>
  <script>
    const dashboardUrl = "https://bot-trello-gargalos.onrender.com/dashboard.html";

    window.TrelloPowerUp.initialize({
      "board-buttons": function () {
        return [
          {
            text: "FlowGuard",
            icon: {
              dark: "https://bot-trello-gargalos.onrender.com/assets/flowguard-logo.png",
              light: "https://bot-trello-gargalos.onrender.com/assets/flowguard-logo-light.png",
            },
            condition: "always",
            url: dashboardUrl,
            target: "_blank",
          },
        ];
      },
    });
  </script>
</body>
</html>
